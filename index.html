<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ごめん / もうやだ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .buttons-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .message {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
    }

    .btn {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      outline: none;
      user-select: none;
    }

    .btn:hover  { transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }

    /* ごめん — pink */
    .btn--gomen {
      background: linear-gradient(135deg, #e91e8c, #c0392b);
      box-shadow:
        0 0 0 0 rgba(233, 30, 140, 0.4),
        0 8px 32px rgba(233, 30, 140, 0.3),
        0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .btn--gomen:hover {
      box-shadow:
        0 0 0 0 rgba(233, 30, 140, 0.4),
        0 12px 40px rgba(233, 30, 140, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.4);
    }
    .btn--gomen.speaking {
      animation: pulse-gomen 0.8s ease-out infinite;
    }

    /* もうやだ — indigo */
    .btn--mada {
      background: linear-gradient(135deg, #5c6bc0, #283593);
      box-shadow:
        0 0 0 0 rgba(92, 107, 192, 0.4),
        0 8px 32px rgba(92, 107, 192, 0.3),
        0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .btn--mada:hover {
      box-shadow:
        0 0 0 0 rgba(92, 107, 192, 0.4),
        0 12px 40px rgba(92, 107, 192, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.4);
    }
    .btn--mada.speaking {
      animation: pulse-mada 0.8s ease-out infinite;
    }

    @keyframes pulse-gomen {
      0%   { box-shadow: 0 0 0 0   rgba(233, 30, 140, 0.6), 0 8px 32px rgba(233, 30, 140, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
      70%  { box-shadow: 0 0 0 30px rgba(233, 30, 140, 0),  0 8px 32px rgba(233, 30, 140, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 0 0   rgba(233, 30, 140, 0),   0 8px 32px rgba(233, 30, 140, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
    }

    @keyframes pulse-mada {
      0%   { box-shadow: 0 0 0 0   rgba(92, 107, 192, 0.6), 0 8px 32px rgba(92, 107, 192, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
      70%  { box-shadow: 0 0 0 30px rgba(92, 107, 192, 0),  0 8px 32px rgba(92, 107, 192, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 0 0   rgba(92, 107, 192, 0),   0 8px 32px rgba(92, 107, 192, 0.3), 0 2px 8px rgba(0,0,0,0.4); }
    }

    .ripple-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: ripple-effect 0.5s ease-out forwards;
    }

    @keyframes ripple-effect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.3em;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="message">ボタンを押してください</p>
    <div class="buttons-row">
      <div class="btn-wrap">
        <button class="btn btn--gomen" onclick="say(this, 'ごめんなさい')">
          ごめん
          <div class="ripple-container"></div>
        </button>
        <p class="subtitle">ごめんなさい</p>
      </div>
      <div class="btn-wrap">
        <button class="btn btn--mada" onclick="say(this, 'もうやだ！')">
          もうやだ
          <div class="ripple-container"></div>
        </button>
        <p class="subtitle">もうやだ！</p>
      </div>
    </div>
  </div>

  <script>
    function say(btn, text) {
      addRipple(btn);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;

        utterance.onstart = () => btn.classList.add('speaking');
        utterance.onend = () => btn.classList.remove('speaking');
        utterance.onerror = () => btn.classList.remove('speaking');

        window.speechSynthesis.speak(utterance);
      }
    }

    function addRipple(btn) {
      const container = btn.querySelector('.ripple-container');
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = '50px';
      ripple.style.left = '75px';
      ripple.style.top = '75px';
      container.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
  </script>
</body>
</html>
